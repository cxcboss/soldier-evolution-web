<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d2c4e" />
    <title>小兵进化 · 港区远征</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="./art/convoy-keyart.webp?v=evo2" />
    <link rel="stylesheet" href="./game.css?v=evo2" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
      <defs>
        <symbol id="i-soldier" viewBox="0 0 24 24">
          <path
            d="M3 14c0-5.8 3-9.5 8.9-9.5s9 3.7 9 9.5l-1.8 1H5zM6.8 16.5h10.5c-.5 3.2-2.2 4.5-5.3 4.5s-4.6-1.3-5.2-4.5Z"
            fill="currentColor"
          />
        </symbol>
        <symbol id="i-shell" viewBox="0 0 24 24">
          <path
            d="M12 2c3.2 2.3 4.5 5 4.5 8.9V17h-9v-6.1C7.5 7 8.8 4.3 12 2Z"
            fill="currentColor"
          />
          <path d="M7 20h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        </symbol>
        <symbol id="i-sound" viewBox="0 0 24 24">
          <path
            d="M4 9h4l5-4v14l-5-4H4zM16 9q3 3 0 6m2-9q6 6 0 12"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.9"
          />
        </symbol>
        <symbol id="i-mute" viewBox="0 0 24 24">
          <path
            d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6m0-6-5 6"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.9"
          />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path
            d="M8 5v14m8-14v14"
            fill="none"
            stroke="currentColor"
            stroke-width="3.7"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-art" viewBox="0 0 24 24">
          <path
            d="m12 3 9 5-9 5-9-5 9-5Zm-8 9.5 8 4.5 8-4.5M4 17l8 4 8-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path
            d="M7 4.8a1.5 1.5 0 0 1 2.2-1.3l12 7.2a1.5 1.5 0 0 1 0 2.6l-12 7.2A1.5 1.5 0 0 1 7 19.2Z"
            fill="currentColor"
          />
        </symbol>
        <symbol id="i-map" viewBox="0 0 24 24">
          <path
            d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zm6-2v15m6-12v15"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-flag" viewBox="0 0 24 24">
          <path
            d="M5 21V3m.5 1c5-3 8 3 13 0l-2.4 4.5 2.4 3.5c-5 3-8-3-13 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-bolt" viewBox="0 0 24 24">
          <path d="M13 2 4 14h7l-1 8 10-12h-7l0-8Z" fill="currentColor" />
        </symbol>
        <symbol id="i-wrench" viewBox="0 0 24 24">
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path
            d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.3l-5.8 3.1 1.1-6.4-4.7-4.6 6.5-.9L12 2.6Z"
            fill="currentColor"
          />
        </symbol>
        <symbol id="i-coin" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
          <path
            d="M12 7v10m-2.5-7.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </symbol>
        <symbol id="i-medal" viewBox="0 0 24 24">
          <path
            d="m5 2 4.5 8m9.5-8-4.5 8M9 2l3 5 3-5M12 9l2 4 4.4.6-3.2 3.2.8 4.4-4-2.1-4 2.1.8-4.4-3.2-3.2L10 13z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-retreat" viewBox="0 0 24 24">
          <path
            d="m12 2 8 3.5V12c0 4-4 7.5-8 10-4-2.5-8-6-8-10V5.5L12 2Zm-3.4 11 3-3 3.8 3.8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="i-mark" viewBox="0 0 32 32">
          <path
            d="m16 2 11.5 6v10c0 3.7-5.9 8.7-11.5 12C10.4 26.7 4.5 21.7 4.5 18V8L16 2Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="m16 7 7.6 4v3.5L16 10.6l-7.6 3.9V11Zm0 6.2 7.6 4c0 1.2-.5 2.2-1.2 3.2L16 17l-6.4 3.4c-.8-1-1.2-2-1.2-3.2Z"
            fill="currentColor"
          />
        </symbol>
      </defs>
    </svg>
    <main id="stage" class="stage" aria-label="小兵进化游戏区" data-phase="loading">
      <canvas
        id="game"
        aria-label="战场。左右拖动换道，上下微调。也可以用方向键或 WASD 移动队伍。"
      ></canvas>
      <!-- 全屏战斗氛围边缘光效层（受击红闪 / 狂热金边 / 霜冻冰霜） -->
      <div id="screenFx" class="screen-fx" aria-hidden="true"></div>
      <!-- 3D 投影飘浮伤害与暴击文字对象池 -->
      <div id="popups" class="popups" aria-hidden="true"></div>

      <header class="hud">
        <div class="readings" aria-label="队伍状态">
          <button id="level" aria-label="选择关卡" title="选择关卡">
            <svg class="map-symbol"><use href="#i-map" /></svg>
            <span class="home-map-label">战役地图</span><span id="levelText">第 1 关</span>
          </button>
          <span class="stat" title="队员人数" aria-label="队员人数">
            <svg class="blue"><use href="#i-soldier" /></svg><b id="count">1</b>
          </span>
          <span class="stat" title="单发炮击伤害" aria-label="单发炮击伤害">
            <svg class="gold"><use href="#i-shell" /></svg><b id="power">26</b>
          </span>
          <div
            id="progress"
            class="progress"
            role="progressbar"
            aria-label="接近首领"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <i></i>
          </div>
        </div>
        <div class="controls">
          <button id="sound" aria-label="关闭声音" title="声音">
            <svg><use id="soundIcon" href="#i-sound" /></svg></button
          ><button id="styles" aria-label="切换角色画面" title="画面对比">
            <svg><use href="#i-art" /></svg></button
          ><button id="pause" aria-label="暂停" title="暂停 (P)" hidden>
            <svg><use href="#i-pause" /></svg>
          </button>
        </div>
      </header>

      <!-- 军团实时进化阶梯徽章 -->
      <div id="evoBadge" class="evo-badge" data-tier="1" hidden>
        <span class="evo-lv" id="evoLevel">Lv.1</span>
        <span class="evo-name" id="evoName">登陆新兵</span>
        <span class="evo-bar"><i id="evoFill"></i></span>
      </div>

      <!-- 顶部 Boss 专属大气战术血条横幅 -->
      <div id="bossHud" class="boss-hud" hidden>
        <div class="boss-hud-head">
          <strong id="bossHudName">铁拳队长</strong>
          <span id="bossHudSkill">震桥重拳</span>
          <em id="bossHudRage" hidden>狂暴</em>
          <b id="bossHudHp">4000</b>
        </div>
        <div class="boss-hud-track"><i id="bossHudFill"></i></div>
      </div>

      <!-- Boss 进场警示横幅 -->
      <div id="bossAlert" class="boss-alert" hidden>
        <small>WARNING · 首领来袭</small>
        <strong id="bossAlertName">铁拳队长</strong>
      </div>

      <!-- 右侧街机连击倍率徽章 -->
      <div id="comboBox" class="combo-box" hidden>
        <div class="combo-num"><b id="comboCount">0</b><span>连击</span></div>
        <div class="combo-mult" id="comboMult">×1.00 火力</div>
        <div class="combo-bar"><i id="comboFill"></i></div>
      </div>

      <!-- 彩色 Buff 芯片组 -->
      <div id="buffs" class="buffs" hidden></div>

      <!-- 战场投影小血条 -->
      <div
        id="bossbar"
        class="bossbar"
        role="meter"
        aria-labelledby="bossName"
        aria-valuemin="0"
        hidden
      >
        <div></div>
        <small id="bossName"></small><b>800</b>
      </div>
      <div id="armorMeter" class="armor-meter" role="img" aria-label="队长护甲" hidden>
        <i></i><i></i><i></i>
      </div>
      <div id="tip" class="tip" hidden></div>

      <!-- 右下角单手大拇指「战术超载」圆环大招按钮 -->
      <button
        id="overdriveBtn"
        class="overdrive-btn"
        aria-label="战术超载齐射"
        title="战术超载齐射 (E / 空格)"
        hidden
      >
        <svg class="od-ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="od-bg" cx="32" cy="32" r="27" />
          <circle id="odArc" class="od-arc" cx="32" cy="32" r="27" />
        </svg>
        <svg class="od-icon" aria-hidden="true"><use href="#i-bolt" /></svg>
        <span id="odLabel">0%</span>
      </button>

      <!-- 首页封面 -->
      <section id="start" class="start" aria-label="出击准备">
        <div class="cover-art" aria-hidden="true"></div>
        <div class="game-title">
          <p>
            <svg><use href="#i-mark" /></svg>港区远征 · 进化版
          </p>
          <h1>小兵<span>进化</span></h1>
        </div>
        <div class="departure">
          <div class="home-meta">
            <span class="meta-pill" title="已收集星级">
              <svg class="gold"><use href="#i-star" /></svg><b id="homeStars">0 / 90</b>
            </span>
            <span class="meta-pill" title="远征军饷">
              <svg class="amber"><use href="#i-coin" /></svg><b id="homeCoins">0</b>
            </span>
            <button id="openArmory" class="armory-entry">
              <svg><use href="#i-wrench" /></svg><span>军械整备</span>
            </button>
          </div>
          <div class="mission">
            <b id="missionNumber" aria-label="关卡">01</b>
            <div>
              <span id="missionChapter">灯塔外港</span>
              <h2 id="missionName">港口外桥</h2>
            </div>
            <svg class="mission-flag" aria-hidden="true"><use href="#i-flag" /></svg>
          </div>
          <button id="startButton" class="primary" disabled>
            <svg><use href="#i-play" /></svg><span>准备中</span>
          </button>
          <p id="instruction">左右拖动 · 下拉后撤 · 满能点超载齐射</p>
        </div>
      </section>

      <!-- 模态面板（暂停 / 结算 / 画面模式 / 战役地图 / 军械整备） -->
      <div id="veil" class="veil" hidden>
        <section
          id="dialog"
          class="dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialogTitle"
        >
          <div class="dialog-top">
            <span class="dialog-emblem" aria-hidden="true"
              ><svg><use id="dialogIcon" href="#i-flag" /></svg
            ></span>
            <div>
              <small id="dialogChapter"></small>
              <h2 id="dialogTitle"></h2>
            </div>
          </div>
          <p id="detail"></p>

          <!-- 结算星级与军饷 -->
          <div id="resultStars" class="result-stars" hidden>
            <div class="star-row" id="starRow">
              <svg><use href="#i-star" /></svg>
              <svg><use href="#i-star" /></svg>
              <svg><use href="#i-star" /></svg>
            </div>
            <div class="reward-pill" id="resultReward">+0 军饷</div>
          </div>
          <dl id="resultStats" class="result-stats" hidden>
            <div>
              <dt>击倒红兵</dt>
              <dd id="resultKills">0</dd>
            </div>
            <div>
              <dt>最高连击</dt>
              <dd id="resultCombo">0</dd>
            </div>
            <div>
              <dt>作战用时</dt>
              <dd id="resultTime">0:00</dd>
            </div>
          </dl>

          <!-- 军械整备永久升级列表 -->
          <div id="armoryPanel" class="armory-panel" hidden>
            <div class="armory-balance">
              <span>当前远征军饷</span>
              <b><svg><use href="#i-coin" /></svg><span id="armoryCoins">0</span></b>
            </div>
            <div id="armoryList" class="armory-list"></div>
          </div>

          <div id="stageList" class="stage-list" aria-label="30 关试玩" hidden></div>
          <div id="options" class="options" hidden>
            <button data-art="hybrid">混合</button><button data-art="ai">AI 贴图</button
            ><button data-art="3d">纯 3D</button>
          </div>
          <button id="continue" class="primary">继续</button>
          <button id="armoryAction" class="secondary" hidden>军械整备升级</button>
          <button id="secondary" class="secondary" hidden>重新开始</button>
          <button id="selectStage" class="secondary" hidden>选择关卡</button>
        </section>
      </div>
      <div id="problem" class="problem" hidden></div>
    </main>
    <script type="module" src="./game.js?v=evo2"></script>
  </body>
</html>
